services:
  postgres:
    image: postgres:16-alpine
    container_name: tarea-u2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tarea_user
      POSTGRES_PASSWORD: tarea_password
      POSTGRES_DB: tarea_u2
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarea_user -d tarea_u2"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: tarea-u2-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: tarea_user
      MONGO_INITDB_ROOT_PASSWORD: tarea_password
      MONGO_INITDB_DATABASE: tarea_u2
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username tarea_user --password tarea_password --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
